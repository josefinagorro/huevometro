<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F2EE" />
  <title>Huevómetro</title>
  <link rel="icon" href="img/icono.png" />
  <link rel="apple-touch-icon" href="img/icono.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pan" viewBox="0 0 24 24"><circle cx="10" cy="12" r="7"/><circle cx="10" cy="12" r="2.5"/><path d="M17 12h5"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <main class="app">
    <header class="top">
      <span class="brand">Huevómetro</span>
      <span class="pill-demo" id="demo" hidden>Modo prueba</span>
    </header>

    <section class="hero" id="hero" data-mood="ok">
      <div class="egg-stage">
        <div class="bubble" id="bubble"></div>
        <button class="egg" id="egg" aria-label="Papá huevo">
          <img src="img/papa-huevo.png" alt="Papá huevo" width="480" height="600" />
        </button>
        <div class="egg-shadow"></div>
      </div>
      <div class="count">
        <span class="num" id="num">–</span>
        <span class="unit">huevos en casa</span>
      </div>
      <div class="status">
        <span class="badge" id="badge"></span>
        <span class="meta" id="meta"></span>
      </div>
    </section>

    <section class="actions">
      <button class="act act-primary" data-open="comi"><svg><use href="#i-pan"/></svg>Comí</button>
      <button class="act" data-open="compre"><svg><use href="#i-cart"/></svg>Compré</button>
      <button class="act act-wide" data-open="contar"><svg><use href="#i-search"/></svg>Contar los de la heladera</button>
    </section>

    <section class="block b-rank">
      <h2>Este mes</h2>
      <ol class="rank" id="rank"></ol>
    </section>

    <section class="block b-feed">
      <h2>Actividad</h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </main>

  <!-- Hojas inferiores -->
  <div class="scrim" id="scrim"></div>

  <form class="sheet" id="sheet-comi" data-sheet="comi">
    <div class="grip"></div>
    <h3>¿Quién comió?</h3>
    <div class="chips" id="chips-quien"></div>
    <input type="text" id="quien" placeholder="Otro nombre" maxlength="30" autocomplete="off" />
    <div class="row">
      <div class="stepper" data-min="1" data-max="12">
        <button type="button" data-d="-1" aria-label="Menos"><svg><use href="#i-minus"/></svg></button>
        <input type="number" id="comi-cant" value="2" inputmode="numeric" />
        <button type="button" data-d="1" aria-label="Más"><svg><use href="#i-plus"/></svg></button>
      </div>
      <input type="date" id="comi-fecha" class="date" />
    </div>
    <button type="submit" class="btn">Guardar</button>
  </form>

  <form class="sheet" id="sheet-compre" data-sheet="compre">
    <div class="grip"></div>
    <h3>¿Cuántos compraste?</h3>
    <div class="chips" id="chips-compra">
      <button type="button" class="chip" data-n="6">6</button>
      <button type="button" class="chip" data-n="12">12</button>
      <button type="button" class="chip on" data-n="30">30</button>
      <button type="button" class="chip" data-n="60">60</button>
    </div>
    <div class="row">
      <div class="stepper" data-min="1" data-max="999">
        <button type="button" data-d="-1" aria-label="Menos"><svg><use href="#i-minus"/></svg></button>
        <input type="number" id="compra-cant" value="30" inputmode="numeric" />
        <button type="button" data-d="1" aria-label="Más"><svg><use href="#i-plus"/></svg></button>
      </div>
      <input type="date" id="compra-fecha" class="date" />
    </div>
    <button type="submit" class="btn">Guardar</button>
  </form>

  <form class="sheet" id="sheet-contar" data-sheet="contar">
    <div class="grip"></div>
    <h3>¿Cuántos hay en la heladera?</h3>
    <div class="stepper stepper-big" data-min="0" data-max="999">
      <button type="button" data-d="-1" aria-label="Menos"><svg><use href="#i-minus"/></svg></button>
      <input type="number" id="contar-cant" value="0" inputmode="numeric" />
      <button type="button" data-d="1" aria-label="Más"><svg><use href="#i-plus"/></svg></button>
    </div>
    <div class="verdict" id="verdict" hidden></div>
    <button type="submit" class="btn" id="contar-btn">Comparar</button>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
